# ОБРАЗЕЦ настроек agents-mcp.
#
# Скопируйте этот файл рядом, в agents-mcp.toml, и впишите свои значения.
# Рабочий файл держите вне системы контроля версий: он перечисляет каталоги и
# пути конкретной машины.
#
# Путь к рабочему файлу передаётся службе переменной окружения AGENTS_MCP_CONFIG
# либо ключом --config (ключ главнее). Если не задано ни то, ни другое, служба
# стартует на значениях по умолчанию — см. src/main.rs и src/config.rs.
# Другие переменные, меняющие работу службы:
# - AGENTS_MCP_TASK_STORE_DSN переопределяет адрес основной базы;
# - RUST_LOG задаёт фильтр журнала;
# - AGENTS_MCP_STREAM_DIR включает потоковые запросы прямых провайдеров и задаёт
#   каталог живой записи;
# - AGENTS_MCP_HISTORY_TRIM_AT задаёт долю окна для вытеснения истории (0.6 по
#   умолчанию, <= 0 выключает вытеснение);
# - CLAUDE_CONFIG_DIR — запасной путь профиля claude-cli, а
#   CLAUDE_CODE_OAUTH_TOKEN / CLAUDE_OAUTH_TOKEN_FILE — источники токена.
#   Без токена учётные данные ищутся относительно USERPROFILE, затем HOME.
# AGENTS_MCP_TRANSCRIPT в штатном runtime ничего не меняет: запись ходов уже
# всегда включена переданным провайдеру каналом.

[server]
host = "127.0.0.1"
port = 8025
# Список разрешённых Host для /mcp — защита от подмены адреса (DNS rebinding):
# запрос с чужим заголовком Host отклоняется. Служба слушает петлевой адрес,
# поэтому хватает localhost, 127.0.0.1 и ::1. Наружу службу выводят
# посредником, а не через host = "0.0.0.0".
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
# Имя экземпляра службы: пишется в agent_calls.instance, по нему при старте
# закрываются только свои повисшие вызовы. Не задано — «имя машины:порт»
# (на транспорте stdio — «имя машины:stdio»). У двух служб на одной базе
# экземпляры обязаны различаться.
# instance = "agents-mcp-1"

[storage]
# Встроенный SQLite (по умолчанию): файл базы и схема создаются сами при первом
# запуске, внешняя СУБД не нужна. Относительный путь резолвится от каталога
# этого config.toml.
sqlite_path = "../data/agents-mcp.sqlite"
# Каталог PID-файла и журнала службы agents-mcp.logs.db. Тоже от каталога config.toml.
log_dir = "../logs"
# Файлы-итоги фоновых вызовов agent_run: <call_id>-<агент>-<uuid>.json.
runs_dir = "../runs"
# Задайте, чтобы вместо SQLite работать на PostgreSQL:
# postgres://user:pass@host:port/db (схема agents_mcp; файлы migrations_pg
# применяются по порядку вручную). Пароль лучше держать в переменной окружения
# AGENTS_MCP_TASK_STORE_DSN, а не здесь. См. раздел «Хранилище» в README.
# task_store_dsn = "postgres://user:pass@db-host:5432/agents"

[agents]
# Относительный путь резолвится от каталога этого config.toml.
agents_dir = "../agents"
hot_reload = true
default_timeout_sec = 120
# Тест-override модели на ВСЕХ агентах: раскомментируйте ОБА поля, чтобы
# прогнать всю платформу на одной модели. Игнорирует per-agent [model].
# Закомментировано → каждый агент работает по своему config.toml; заданное
# одно поле из двух игнорируется.
# force_provider = "deepseek"
# force_model = "deepseek-flash"

# ── Провайдеры LLM ──────────────────────────────────────────────────────────
# Каждый провайдер опционален. Если переменная окружения с ключом пуста или не
# задана, провайдер не регистрируется (при старте пишется предупреждение), а
# агенты с этим провайдером падают с ошибкой UnknownProvider.

# ── Пул прямых HTTP-поставщиков [providers.direct.<имя>] ─────────────────────
# Любой поставщик добавляется такой же секцией, без правок кода. Вид API — поле
# api: "openai" (OpenAI-совместимый, по умолчанию) или "anthropic" (Anthropic
# Messages; base_url без /v1, prompt_cache = true включает кэш промпта). Агент
# выбирает его через provider = "<имя>" в своём config.toml, а ключ кладётся в
# переменную окружения, названную в api_key_env. Без ключа в
# окружении провайдер не регистрируется. Имя не должно совпадать с
# зарезервированными (mock / openrouter / anthropic / claude-cli / codex-cli) —
# такую секцию служба пропускает.
[providers.direct.deepseek]
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com/v1"
# Прямой выход на поставщика бывает закрыт сетью. Тогда можно задать сетевого
# посредника (допустимы только схемы http и https), а свои сети идут мимо него
# всегда.
# Для логина и пароля посредника можно использовать подстановки ${ИМЯ}.
# proxy = "http://proxy.example:3128"
# proxy_bypass = "corp.local"

# Цены в долларах за миллион токенов; пиковый тариф, сверено 10.09.2026 —
# сверяйте с сайтом поставщика.
[providers.direct.deepseek.prices."deepseek-flash"]
input = 0.3
output = 1.2
cache_read = 0.006

[providers.direct.deepseek.prices."deepseek-v4-pro"]
input = 1.32
output = 3.96
cache_read = 0.044

# Claude через Claude Code CLI (subprocess `claude -p`). API-ключ не нужен:
# авторизация — вход в Claude Code на этой машине.
[providers.claude_cli]
executable = "C:/Users/<пользователь>/.local/bin/claude.exe"
max_concurrent = 2
default_max_turns = 8
# Отдельный каталог профиля для вызовов агентов (CLAUDE_CONFIG_DIR): пустой
# CLAUDE.md, без чужих правил и навыков — так вызов не тащит лишний контекст.
# Авторизация при этом берётся из входа в Claude Code, ключ не нужен. Не задано —
# берётся переменная окружения CLAUDE_CONFIG_DIR.
# config_dir = "C:/agents-mcp/agent-home"
# Отдельных полей proxy/proxy_bypass у claude-cli нет. Процесс наследует
# HTTP_PROXY/HTTPS_PROXY/NO_PROXY из окружения службы.

# OpenAI через Codex CLI (subprocess `codex exec`). Авторизация — вход в Codex
# CLI; профиль с учётными данными берётся из codex_home (CODEX_HOME).
[providers.codex_cli]
executable = "codex"
codex_home = "C:/Users/<пользователь>/.codex"
max_concurrent = 2
# Значение proxy без проверки схемы передаётся процессу как HTTP_PROXY и
# HTTPS_PROXY. Автоматического обхода локальных сетей нет: при необходимости
# перечислите их в proxy_bypass. Оно передаётся как NO_PROXY только вместе с proxy.
# proxy = "http://proxy.example:3128"
# proxy_bypass = "corp.local"

# Grok через локальный Grok CLI (subprocess `grok`). Авторизация — вход в CLI.
# user_config нужен для чтения имён личных MCP-серверов: провайдер гасит их в
# отдельном config.toml вызова, чтобы агент видел только свой mcp_config.
# Интеграции Claude/Cursor провайдер также отключает окружением процесса
# GROK_CLAUDE_MCPS_ENABLED=false и GROK_CURSOR_MCPS_ENABLED=false.
[providers.grok_cli]
executable = "C:/Users/<пользователь>/.grok/bin/grok.exe"
user_config = "C:/Users/<пользователь>/.grok/config.toml"
max_concurrent = 2
default_max_turns = 40
tool_timeout_sec = 120

# ── Навыки (push-инъекция skills_index в промпты агентов) ───────────────────
# Необязательная внешняя библиотека навыков по MCP-адресу: служба читает из неё
# каталог навыков и подмешивает подходящие в промпты. Пусто — возможность
# выключена.
[skills]
# rag_query_url = "http://127.0.0.1:8019/mcp"

# ── Файловые MCP-инструменты (fs_*) ─────────────────────────────────────────
# Разрешённые корни для fs_read_file / fs_write_file / fs_edit_file / fs_mkdir /
# fs_list_dir. Ключ allowed_roots в [execution] агента заменяет их для этого агента.
# Операции допускаются ТОЛЬКО внутри этих каталогов (защита от записи в систему).
# Каждый вызов вдобавок заперт в рабочем каталоге своего задания.
[fs]
allowed_roots = ["C:/agents-mcp/work"]
